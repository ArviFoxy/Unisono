[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

# The crates of the workspace as they depend on each other.
[workspace.dependencies]
unisono-core = { path = "crates/unisono-core", version = "0.1.0" }
unisono-dsp = { path = "crates/unisono-dsp", version = "0.1.0" }
unisono-runtime = { path = "crates/unisono-runtime", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
# `translating` is set when the core is translated to Lean.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(translating)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
