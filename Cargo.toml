[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

# The crates of the workspace as they depend on each other.
[workspace.dependencies]
unisono-core = { path = "crates/unisono-core", version = "0.1.0" }
unisono-dsp = { path = "crates/unisono-dsp", version = "0.1.0" }
unisono-metrics = { path = "crates/unisono-metrics", version = "0.1.0" }
unisono-runtime = { path = "crates/unisono-runtime", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
# `translating` is set when the core is translated to Lean.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(translating)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Optimize the Kaiser-sinc FIR resampler and simulator harness in dev/test
# builds while preserving debug assertions and overflow checks, so end-to-end
# real-DSP simulation tests run in seconds rather than minutes.
[profile.dev.package.unisono-dsp]
opt-level = 2

[profile.dev.package.unisono-sim]
opt-level = 2
