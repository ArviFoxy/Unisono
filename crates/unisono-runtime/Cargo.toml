[package]
name = "unisono-runtime"
description = "Runtime I/O, threading, timestamped UDP sockets, SPSC rings, audio backend interfaces, virtual devices, and playback pipeline around unisono-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
unisono-core.workspace = true
unisono-dsp.workspace = true

# The ring is checked under every interleaving of its two threads by loom,
# which replaces the atomics when the crate is built with `--cfg loom`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true
