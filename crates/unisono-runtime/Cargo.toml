[package]
name = "unisono-runtime"
description = "The shell around unisono's core: clocks, sockets with packet timestamps, threads and the rings between them."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"

# The ring is checked under every interleaving of its two threads by loom,
# which replaces the atomics when the crate is built with `--cfg loom`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true
