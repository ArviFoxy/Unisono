name: check

on:
  push:
    branches: [main]
  pull_request:
  # Once a week, so that a change outside the repository that breaks the
  # check is noticed: a tool that is fetched, a cache that is gone.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# The jobs read the repository and nothing else.
permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Actions are named by the commit they were reviewed at; the comment gives the
# release that the commit belongs to.
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The crates for PipeWire and ALSA build against their headers, the
      # first with clang.
      - name: Install the headers of PipeWire and ALSA
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install --yes libpipewire-0.3-dev libclang-dev libasound2-dev
      - run: just sizes format-check lint test targets realtime cost

  # The tests on 64-bit ARM. The crates for PipeWire and ALSA are left out:
  # they are tested in their containers.
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --exclude unisono-pipewire --exclude unisono-alsa

  # ARMv7 without hardware floating point, emulated: the tests of the core,
  # of the signal processing and of the metrics, which are where arithmetic
  # could differ.
  armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-arm -L /usr/arm-linux-gnueabi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the emulator and the C toolchain for ARM
        run: >-
          sudo apt-get -o Acquire::Retries=5 update &&
          sudo apt-get -o Acquire::Retries=5 install --yes
          qemu-user gcc-arm-linux-gnueabi libc6-dev-armel-cross
      - run: >-
          cargo test --target armv7-unknown-linux-gnueabi
          --package unisono-core --package unisono-dsp --package unisono-metrics

  # macOS, whose kernel stamps no departures: everything builds, and the
  # tests that need no such stamps run. The tests of the runtime and of the
  # program hold timing to microseconds and are run on Linux.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --exclude unisono-pipewire --exclude unisono-alsa
      - run: >-
          cargo test --package unisono-core --package unisono-dsp
          --package unisono-metrics --package unisono-sim

  # The tests against a running PipeWire, in a container.
  pipewire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Compute audio image tag
        id: audio-image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="$(sha256sum containers/audio/Dockerfile rust-toolchain.toml | sha256sum | cut -c1-16)"
          echo "image=ghcr.io/${owner}/unisono-test-audio" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt audio test image
        id: pull-image
        env:
          IMAGE: ${{ steps.audio-image.outputs.image }}
          TAG: ${{ steps.audio-image.outputs.tag }}
        run: |
          if docker pull "${IMAGE}:${TAG}"; then
            docker tag "${IMAGE}:${TAG}" unisono-test-audio
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: steps.pull-image.outputs.pulled != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build audio test image
        if: steps.pull-image.outputs.pulled != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/audio/Dockerfile
          load: true
          tags: unisono-test-audio
          cache-from: type=gha,scope=audio-container
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,scope=audio-container,mode=max' || '' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/container/cargo/registry/index
            target/container/cargo/registry/cache
            target/container/cargo/git/db
            target/container/target
          key: audio-cargo-pipewire-${{ steps.audio-image.outputs.tag }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            audio-cargo-pipewire-${{ steps.audio-image.outputs.tag }}-
      - run: UNISONO_SKIP_CONTAINER_BUILD=1 just pipewire

  # The tests of the ALSA device, against the device that PipeWire gives
  # ALSA programs, in a container.
  alsa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Compute audio image tag
        id: audio-image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="$(sha256sum containers/audio/Dockerfile rust-toolchain.toml | sha256sum | cut -c1-16)"
          echo "image=ghcr.io/${owner}/unisono-test-audio" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt audio test image
        id: pull-image
        env:
          IMAGE: ${{ steps.audio-image.outputs.image }}
          TAG: ${{ steps.audio-image.outputs.tag }}
        run: |
          if docker pull "${IMAGE}:${TAG}"; then
            docker tag "${IMAGE}:${TAG}" unisono-test-audio
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: steps.pull-image.outputs.pulled != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build audio test image
        if: steps.pull-image.outputs.pulled != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/audio/Dockerfile
          load: true
          tags: unisono-test-audio
          cache-from: type=gha,scope=audio-container
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,scope=audio-container,mode=max' || '' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/container/cargo/registry/index
            target/container/cargo/registry/cache
            target/container/cargo/git/db
            target/container/target
          key: audio-cargo-alsa-${{ steps.audio-image.outputs.tag }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            audio-cargo-alsa-${{ steps.audio-image.outputs.tag }}-
      - run: UNISONO_SKIP_CONTAINER_BUILD=1 just alsa

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors \
              https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Cache built Charon/Aeneas, opam, and Lake artifacts (including Aeneas's
      # Lean library) so proof runs generate UnisonoCore directly without
      # checking generated Lean files into git.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/aeneas
            ~/.opam
            lean/.lake
          key: proofs-${{ runner.os }}-${{ hashFiles('tools/proof-tools.sh') }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}
          restore-keys: |
            proofs-${{ runner.os }}-${{ hashFiles('tools/proof-tools.sh') }}-
      - name: Install opam when Aeneas needs building
        run: |
          rev="$(sed -n 's/^AENEAS_REV=//p' tools/proof-tools.sh)"
          if [ ! -x .tools/aeneas/bin/aeneas ] || [ ! -x .tools/aeneas/charon/bin/charon ] || [ "$(cat .tools/aeneas/.built-commit 2>/dev/null || true)" != "$rev" ]; then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install --yes opam libgmp-dev pkg-config
          fi
      - run: just prove translation-check

  # The documents written in LaTeX: each PDF in the repository is built from
  # its current source, and each source builds without a LaTeX warning.
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install LaTeX and the PDF tools
        run: >-
          sudo apt-get -o Acquire::Retries=5 update &&
          sudo apt-get -o Acquire::Retries=5 install --yes --no-install-recommends
          latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          poppler-utils
      - run: just pdfs-check pdfs

  # Known vulnerabilities in what the crates depend on, the licences of the
  # dependencies, and where they come from.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: tools/realtime-check/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: tools/realtime-audio/Cargo.toml
