name: check

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just format-check lint test targets

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The Lean library of Aeneas is built from source and takes long without this.
      - uses: actions/cache@v4
        with:
          path: |
            .tools/aeneas
            lean/.lake
          key: proofs-${{ hashFiles('tools/proof-tools.sh', 'lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - run: just prove translation-check

  translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install opam
        run: sudo apt-get update && sudo apt-get install --yes opam libgmp-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            .tools/aeneas
            ~/.opam
          key: translation-${{ hashFiles('tools/proof-tools.sh') }}
      - run: just translation
