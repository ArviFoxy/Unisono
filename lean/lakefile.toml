name = "unisono"
defaultTargets = ["Unisono"]

# The Lean library of Aeneas, from the checkout that tools/proof-tools.sh
# makes: the translation in UnisonoCore and this library then come from
# the same commit.
[[require]]
name = "aeneas"
path = "../.tools/aeneas/backends/lean"

# The translation of crates/unisono-core, written by tools/extract.sh. A name
# that the translation uses and nothing defines fails the build, rather than
# becoming a variable of any type: Aeneas writes a floating-point number of
# the Rust as the type `F64`, which its library does not define.
[[lean_lib]]
name = "UnisonoCore"
leanOptions = { autoImplicit = false }

# The specifications and the proofs. A warning fails the build, so a proof
# with a gap cannot pass.
[[lean_lib]]
name = "Unisono"
leanOptions = { warningAsError = true, autoImplicit = false }
